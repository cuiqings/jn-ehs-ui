online-build:       # This job runs in the build stage, which runs first.
  stage: build
  script:
    - echo "Building application..."
    - pwd
    - node -v
    - yarn -v
    - npm set registry http://10.46.249.36:8081/repository/npm-proxy-taobao/
    - yarn config set registry http://10.46.249.36:8081/repository/npm-proxy-taobao/
    - yarn config set ignore-engines true
    - cp /work/yarn.lock ./
    - npm get registry
    - yarn config get registry
    - yarn install
    - yarn run build
    - sudo rm -rf /work/nginx/html/ehs/dist-bak 
    - sudo mv /work/nginx/html/ehs/dist /work/nginx/html/ehs/dist-bak
    - sudo mv dist /work/nginx/html/ehs/ 
    - echo "Compile complete."
  tags:
    - gitlab-runner-97
  only:
    refs:
      - online
  when: manual